ight="800" text-anchor="middle" letter-spacing="-0.3">Checked, then texted.</text><text x="500" y="328" font-size="14.5" fill="#8C97B8" font-weight="500" text-anchor="middle" >Recitation. Schedule. Restrictions. Backup.</text></g><g class="k15" ><text x="500" y="296" font-size="27" fill="#F2F5FF" font-weight="800" text-anchor="middle" letter-spacing="-0.3">Miss it? It calls.</text><text x="500" y="328" font-size="14.5" fill="#8C97B8" font-weight="500" text-anchor="middle" >Only if you said yes. Never overnight.</text></g><rect x="446" y="372" width="20" height="4" rx="2" fill="#243056" /><g class="k16" ><rect x="446" y="372" width="20" height="4" rx="2" fill="#2EE59D" /></g><rect x="474" y="372" width="20" height="4" rx="2" fill="#243056" /><g class="k17" ><rect x="474" y="372" width="20" height="4" rx="2" fill="#2EE59D" /></g><rect x="502" y="372" width="20" height="4" rx="2" fill="#243056" /><g class="k18" ><rect x="502" y="372" width="20" height="4" rx="2" fill="#2EE59D" /></g><rect x="530" y="372" width="20" height="4" rx="2" fill="#243056" /><g class="k19" ><rect x="530" y="372" width="20" height="4" rx="2" fill="#2EE59D" /></g></svg>