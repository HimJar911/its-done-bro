" fill="#F2F2F7" font-weight="500" text-anchor="start" >if you want a backup.</text></g><g class="k9" ><rect x="74" y="590" width="236" height="66" rx="16" fill="#1C1C22" stroke="#2C2C34" stroke-width="1.2" /><rect x="86" y="602" width="42" height="42" rx="10" fill="#2EE59D" /><path d="M100 623 h14 M107 616 v14" stroke="#04241A" stroke-width="3.4" stroke-linecap="round"/><text x="138" y="620" font-size="15.5" fill="#F2F5FF" font-weight="700" text-anchor="start" >Add class</text><text x="138" y="640" font-size="12.5" fill="#8E8E93" font-weight="500" text-anchor="start" >Open the registration page</text><path d="M292 617 l6 6 l-6 6" fill="none" stroke="#6C6C74" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g clip-path="url(#clipB)"><rect x="648" y="68" width="294" height="604" rx="0" fill="url(#wall)" /><rect x="762" y="78" width="66" height="20" rx="10" fill="#05070D" /><text x="795" y="150" font-size="15" fill="#D6DEF8" font-weight="600" text-anchor="middle" >Tuesday</text><text x="795" y="222" font-size="78" fill="#FFFFFF" font-weight="300" text-anchor="middle" letter-spacing="-2">2:07</text><rect x="670" y="568" width="40" height="40" rx="20" fill="#FFFFFF22" /><rect x="880" y="568" width="40" height="40" rx="20" fill="#FFFFFF22" /><g class="k10" ><rect x="662" y="262" width="266" height="96" rx="24" fill="#2A2F4B" stroke="#FFFFFF22" stroke-width="1" /><rect x="676" y="276" width="24" height="24" rx="7" fill="url(#avatar)" /><text x="688" y="293" font-size="14" fill="#04241A" font-weight="800" text-anchor="middle" >C</text><text x="708" y="293" font-size="12" fill="#C9D1EA" font-weight="700" text-anchor="start" letter-spacing="1">CUBBIE</text><text x="912" y="293" font-size="12" fill="#9FA9CB" font-weight="500" text-anchor="end" >now</text><text x="676" y="320" font-size="14.5" fill="#FFFFFF" font-weight="700" text-anchor="start" >Seat found: CSE 340 · Sec 04</text><text x="676" y="340" font-size="13" fill="#C9D1EA" font-weight="5