<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="You talk to Cubbie like a friend: watch only one professor, ask why a section wasn't mentioned, pause it, or tell it you got in."><style>text{font-family:-apple-system, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif}@keyframes k1{0%,0.769%{opacity:0;transform:translateY(10px)}4.231%,93.0%{opacity:1;transform:translateY(0)}97%,100%{opacity:0}}.k1{animation:k1 13.0s cubic-bezier(.2,.7,.2,1) infinite both;transform-box:fill-box;transform-origin:center}@keyframes k2{0%,1.538%{opacity:0;transform:translateY(10px)}5.0%,93.0%{opacity:1;transform:translateY(0)}97%,100%{opacity:0}}.k2{animation:k2 13.0s cubic-bezier(.2,.7,.2,1) infinite both;transform-box:fill-box;transform-origin:center}@keyframes k3{0%,3.846%{opacity:0;transform:translateY(10px)}7.308%,93.0%{opacity:1;transform:translateY(0)}97%,100%{opacity:0}}.k3{animation:k3 13.0s cubic-bezier(.2,.7,.2,1) infinite both;transform-box:fill-box;transform-origin:center}@keyframes k4{0%,5.385%{opacity:0;transform:translateY(10px)}8.846%,93.0%{opacity:1;transform:translateY(0)}97%,100%{opacity:0}}.k4{animation:k4 13.0s cubic-bezier(.2,.7,.2,1) infinite both;transform-box:fill-box;transform-origin:center}@keyframes up{0%,55.385%{transform:translateY(0)}60.0%,75.385%{transform:translateY(-70px)}80.0%,93%{transform:translateY(-120px)}97%,100%{transform:translateY(0)}}.up{animation:up 13.0s ease-in-out infinite both}@keyframes k5{0%,7.692%{opacity:0;transform:translateY(10px)}11.154%,93.0%{opacity:1;transform:translateY(0)}97%,100%{opacity:0}}.k5{animation:k5 13.0s cubic-bezier(.2,.7,.2,1) infinite both;transform-box:fill-box;transform-origin:center}@keyframes k6{0%,16.923%{opacity:0;transform:translateY(10px)}20.385%,93.0%{opacity:1;transform:translateY(0)}97%,100%{opacity:0}}.k6{animation:k6 13.0s cubic-bezier(.2,.7,.2,1) infinite both;transform-box:fill-box;transform-origin:center}@keyframes k7{0%,30.769%{opacity:0;transform:translateY(10px)}34.231%,93.0%{opacity:1;transform:translateY(0)}97%,100%{opacity:0}}.k7{animation:k7 13.0s cubic-bezier(.2,.7,.2,1) infinite both;transform-box:fill-box;transform-origin:center}@keyframes k8{0%,40.769%{opacity:0;transform:translateY(10px)}44.231%,93.0%{opacity:1;transform:translateY(0)}97%,100%{opacity:0}}.k8{animation:k8 13.0s cubic-bezier(.2,.7,.2,1) infinite both;transform-box:fill-box;transform-origin:center}@keyframes k9{0%,56.923%{opacity:0;transform:translateY(10px)}60.385%,93.0%{opacity:1;transform:translateY(0)}97%,100%{opacity:0}}.k9{animation:k9 13.0s cubic-bezier(.2,.7,.2,1) infinite both;transform-box:fill-box;transform-origin:center}@keyframes k10{0%,64.615%{opacity:0;transform:translateY(10px)}68.077%,93.0%{opacity:1;transform:translateY(0)}97%,100%{opacity:0}}.k10{animation:k10 13.0s cubic-bezier(.2,.7,.2,1) infinite both;transform-box:fill-box;transform-origin:center}@keyframes k11{0%,76.923%{opacity:0;transform:translateY(10px)}80.385%,93.0%{opacity:1;transform:translateY(0)}97%,100%{opacity:0}}.k11{animation:k11 13.0s cubic-bezier(.2,.7,.2,1) infinite both;transform-box:fill-box;transform-origin:center}@keyframes k12{0%,83.077%{opacity:0;transform:translateY(10px)}86.538%,93.0%{opacity:1;transform:translateY(0)}97%,100%{opacity:0}}.k12{animation:k12 13.0s cubic-bezier(.2,.7,.2,1) infinite both;transform-box:fill-box;transform-origin:center}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F1F"/><stop offset="1" stop-color="#111B38"/></linearGradient><linearGradient id="av" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2EE59D"/><stop offset="1" stop-color="#5B9DFF"/></linearGradient><linearGradient id="btn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#19C98A"/><stop offset="1" stop-color="#2EE59D"/></linearGradient><linearGradient id="you" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A8CFF"/><stop offset="1" stop-color="#0B6BFF"/></linearGradient><linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B2B5E"/><stop offset="0.55" stop-color="#14214A"/><stop offset="1" stop-color="#0B1230"/></linearGradient><radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2EE59D" stop-opacity="0.20"/><stop offset="1" stop-color="#2EE59D" stop-opacity="0"/></radialGradient><clipPath id="cc"><rect x="472" y="164" width="466" height="374"/></clipPath></defs><rect x="0" y="0" width="1000" height="600" rx="26" fill="url(#bg)" /><ellipse cx="500" cy="300" rx="420" ry="260" fill="url(#halo)"/><g transform="translate(54 46) scale(0.85)"><circle r="11" fill="none" stroke="#2EE59D" stroke-width="2.2"/><circle r="5.5" fill="none" stroke="#2EE59D" stroke-width="2.2"/><circle r="1.9" fill="#2EE59D"/><path d="M-16 0H-7M7 0H16M0 -16V-7M0 7V16" stroke="#2EE59D" stroke-width="2.2" stroke-linecap="round"/></g><text x="76" y="52" font-size="17" fill="#F2F5FF" font-weight="800" text-anchor="start" >Seat Sniper</text><text x="946" y="52" font-size="12" fill="#9AA6C8" font-weight="800" text-anchor="end" letter-spacing="2">HOW IT FEELS</text><text x="946" y="570" font-size="12" fill="#5E6B93" font-weight="700" text-anchor="end" letter-spacing="1.4">09 / 12</text><g class="k1"><text x="64" y="190" font-size="52" fill="#F2F5FF" font-weight="800" text-anchor="start" letter-spacing="-1">Ask it like</text></g><g class="k2"><text x="64" y="252" font-size="52" fill="#2EE59D" font-weight="800" text-anchor="start" letter-spacing="-1">a friend.</text></g><g class="k3"><text x="64" y="306" font-size="18" fill="#9AA6C8" font-weight="500" text-anchor="start" >No commands. No menus.</text></g><g class="k4"><text x="64" y="334" font-size="18" fill="#9AA6C8" font-weight="500" text-anchor="start" >Just say what you want.</text></g><rect x="470" y="90" width="470" height="450" rx="26" fill="#05070D" stroke="#2B3558" stroke-width="2" /><circle cx="705" cy="124" r="15" fill="url(#av)" /><text x="705" y="130" font-size="16" fill="#04241A" font-weight="800" text-anchor="middle" >C</text><text x="705" y="152" font-size="12" fill="#C9D1EA" font-weight="600" text-anchor="middle" >Cubbie</text><rect x="472" y="162" width="466" height="1" rx="0" fill="#1D2236" /><g clip-path="url(#cc)"><g class="up"><g class="k5"><rect x="628" y="182" width="290" height="56" rx="19" fill="url(#you)" /><text x="642" y="206" font-size="15" fill="#FFFFFF" font-weight="500" text-anchor="start" >Watch BIO 101, but only</text><text x="642" y="226" font-size="15" fill="#FFFFFF" font-weight="500" text-anchor="start" >with Prof Lee.</text></g><g class="k6"><rect x="492" y="250" width="236" height="56" rx="19" fill="#26262B" /><text x="506" y="274" font-size="15" fill="#F2F2F7" font-weight="500" text-anchor="start" >On it. Watching only</text><text x="506" y="294" font-size="15" fill="#F2F2F7" font-weight="500" text-anchor="start" >Prof Lee's sections.</text></g><g class="k7"><rect x="682" y="318" width="236" height="56" rx="19" fill="url(#you)" /><text x="696" y="342" font-size="15" fill="#FFFFFF" font-weight="500" text-anchor="start" >Why didn't you tell me</text><text x="696" y="362" font-size="15" fill="#FFFFFF" font-weight="500" text-anchor="start" >about section 3?</text></g><g class="k8"><rect x="492" y="386" width="290" height="56" rx="19" fill="#26262B" /><text x="506" y="410" font-size="15" fill="#F2F2F7" font-weight="500" text-anchor="start" >Section 3 had a seat, but</text><text x="506" y="430" font-size="15" fill="#F2F2F7" font-weight="500" text-anchor="start" >its required lab was full.</text></g><g class="k9"><rect x="682" y="454" width="236" height="36" rx="19" fill="url(#you)" /><text x="696" y="478" font-size="15" fill="#FFFFFF" font-weight="500" text-anchor="start" >Pause it for an hour.</text></g><g class="k10"><rect x="492" y="502" width="236" height="36" rx="19" fill="#26262B" /><text x="506" y="526" font-size="15" fill="#F2F2F7" font-weight="500" text-anchor="start" >Paused. Back at 3:40.</text></g><g class="k11"><rect x="682" y="550" width="236" height="36" rx="19" fill="url(#you)" /><text x="696" y="574" font-size="15" fill="#FFFFFF" font-weight="500" text-anchor="start" >I got in!</text></g><g class="k12"><rect x="492" y="598" width="290" height="36" rx="19" fill="#26262B" /><text x="506" y="622" font-size="15" fill="#F2F2F7" font-weight="500" text-anchor="start" >Nice. I've stopped watching it.</text></g></g></g></svg>