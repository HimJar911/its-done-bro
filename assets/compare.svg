<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="A plain seat alert only says a seat opened. Seat Sniper says the recitation is open, it fits your schedule, nothing restricts it, and a backup exists."><style>text{font-family:-apple-system,'SF Pro Text','Segoe UI',Inter,Helvetica,Arial,sans-serif}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#101A33"/></linearGradient><linearGradient id="av" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2EE59D"/><stop offset="1" stop-color="#5B9DFF"/></linearGradient></defs><rect x="0" y="0" width="1000" height="340" rx="26" fill="url(#bg)"/><text x="250" y="52" font-size="13" fill="#8C97B8" font-weight="800" text-anchor="middle" letter-spacing="1.8">A PLAIN SEAT ALERT</text><text x="750" y="52" font-size="13" fill="#2EE59D" font-weight="800" text-anchor="middle" letter-spacing="1.8">SEAT SNIPER</text><rect x="60" y="80" width="380" height="92" rx="24" fill="#232838" stroke="#FFFFFF22" stroke-width="1"/><rect x="78" y="96" width="26" height="26" rx="8" fill="#4A5170"/><text x="91" y="115" font-size="15" fill="#C9D1EA" font-weight="800" text-anchor="middle" >!</text><text x="114" y="114" font-size="12" fill="#9FA9CB" font-weight="700" text-anchor="start" letter-spacing="1">SEAT ALERT</text><text x="424" y="114" font-size="12" fill="#9FA9CB" font-weight="500" text-anchor="end" >now</text><text x="78" y="146" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="start" >Seat open: CSE 340</text><text x="78" y="166" font-size="14" fill="#C9D1EA" font-weight="500" text-anchor="start" >Section 04 has 1 seat.</text><circle cx="76" cy="207" r="9" fill="none" stroke="#4A5170" stroke-width="2"/><path d="M72 211 l8 -8 M72 203 l8 8" stroke="#6B7399" stroke-width="2" stroke-linecap="round" transform="translate(0 0)"/><text x="98" y="212" font-size="15" fill="#7E88AC" font-weight="500" text-anchor="start" >Is the recitation open?</text><circle cx="76" cy="235" r="9" fill="none" stroke="#4A5170" stroke-width="2"/><path d="M72 239 l8 -8 M72 231 l8 8" stroke="#6B7399" stroke-width="2" stroke-linecap="round" transform="translate(0 0)"/><text x="98" y="240" font-size="15" fill="#7E88AC" font-weight="500" text-anchor="start" >Does it fit your week?</text><circle cx="76" cy="263" r="9" fill="none" stroke="#4A5170" stroke-width="2"/><path d="M72 267 l8 -8 M72 259 l8 8" stroke="#6B7399" stroke-width="2" stroke-linecap="round" transform="translate(0 0)"/><text x="98" y="268" font-size="15" fill="#7E88AC" font-weight="500" text-anchor="start" >Is the seat restricted?</text><circle cx="76" cy="291" r="9" fill="none" stroke="#4A5170" stroke-width="2"/><path d="M72 295 l8 -8 M72 287 l8 8" stroke="#6B7399" stroke-width="2" stroke-linecap="round" transform="translate(0 0)"/><text x="98" y="296" font-size="15" fill="#7E88AC" font-weight="500" text-anchor="start" >What if it's taken?</text><rect x="560" y="80" width="380" height="92" rx="24" fill="#15332B" stroke="#2EE59D66" stroke-width="1.5"/><rect x="578" y="96" width="26" height="26" rx="8" fill="url(#av)"/><text x="591" y="115" font-size="14" fill="#04241A" font-weight="800" text-anchor="middle" >C</text><text x="614" y="114" font-size="12" fill="#9FE9CA" font-weight="700" text-anchor="start" letter-spacing="1">CUBBIE</text><text x="924" y="114" font-size="12" fill="#9FE9CA" font-weight="500" text-anchor="end" >now</text><text x="578" y="146" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="start" >Seat found: CSE 340 · Sec 04</text><text x="578" y="166" font-size="14" fill="#B9F5DC" font-weight="500" text-anchor="start" >Take it. Here's the link.</text><circle cx="576" cy="207" r="9" fill="#2EE59D"/><path d="M571.5 207 l3.4 3.6 l6 -7" stroke="#06241A" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="598" y="212" font-size="15" fill="#F2F5FF" font-weight="600" text-anchor="start" >Recitation 04B is open</text><circle cx="576" cy="235" r="9" fill="#2EE59D"/><path d="M571.5 235 l3.4 3.6 l6 -7" stroke="#06241A" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="598" y="240" font-size="15" fill="#F2F5FF" font-weight="600" text-anchor="start" >Fits your schedule</text><circle cx="576" cy="263" r="9" fill="#2EE59D"/><path d="M571.5 263 l3.4 3.6 l6 -7" stroke="#06241A" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="598" y="268" font-size="15" fill="#F2F5FF" font-weight="600" text-anchor="start" >No reserved or consent seat</text><circle cx="576" cy="291" r="9" fill="#2EE59D"/><path d="M571.5 291 l3.4 3.6 l6 -7" stroke="#06241A" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="598" y="296" font-size="15" fill="#F2F5FF" font-weight="600" text-anchor="start" >Backup: Sec 08 also works</text><rect x="498" y="150" width="4" height="150" rx="2" fill="#243056"/></svg>