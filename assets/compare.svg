<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="A plain seat alert only says a seat opened. It's Done Bro says the lab is open, it fits your schedule, nothing restricts it, and a backup is ready."><style>@keyframes a1{0%,7.5%{opacity:0;transform:translateY(0px)}13.75%,91.25%{opacity:1;transform:none}96.25%,100%{opacity:0}}.a1{animation:a1 8.0s cubic-bezier(.2,.8,.2,1) infinite both}@keyframes a2{0%,15.0%{opacity:0;transform:translateY(0px)}21.25%,91.25%{opacity:1;transform:none}96.25%,100%{opacity:0}}.a2{animation:a2 8.0s cubic-bezier(.2,.8,.2,1) infinite both}@keyframes a3{0%,22.5%{opacity:0;transform:translateY(0px)}28.75%,91.25%{opacity:1;transform:none}96.25%,100%{opacity:0}}.a3{animation:a3 8.0s cubic-bezier(.2,.8,.2,1) infinite both}@keyframes a4{0%,30.0%{opacity:0;transform:translateY(0px)}36.25%,91.25%{opacity:1;transform:none}96.25%,100%{opacity:0}}.a4{animation:a4 8.0s cubic-bezier(.2,.8,.2,1) infinite both}</style><rect x="0" y="0" width="1200" height="620" rx="28" fill="#F6F2E9"/><text x="80" y="92" font-size="13" fill="#6B665C" font-weight="700" text-anchor="start" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" letter-spacing="3.2">THE DIFFERENCE</text><text x="80" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="60" fill="#14120F" letter-spacing="-1.6">Not every opening <tspan fill="#1F3FFF" font-style="italic">is yours.</tspan></text><text x="80" y="252" font-size="12.5" fill="#6B665C" font-weight="700" text-anchor="start" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" letter-spacing="2.4">A PLAIN SEAT ALERT</text><text x="640" y="252" font-size="12.5" fill="#1F3FFF" font-weight="700" text-anchor="start" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" letter-spacing="2.4">IT'S DONE BRO</text><rect x="80" y="274" width="480" height="120" rx